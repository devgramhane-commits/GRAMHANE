<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gramhane API: Tarayıcı Örneği</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; max-width: 560px; margin: 40px auto; padding: 0 16px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 6px; border-bottom: 1px solid #30363d; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { color: #8b949e; font-size: 12px; font-weight: 600; }
  .yukari { color: #10b981; } .asagi { color: #ef4444; }
  small { color: #8b949e; }
</style>
</head>
<body>
<h1>Canlı Fiyatlar</h1>
<table>
  <thead><tr><th>Varlık</th><th>Alış</th><th>Satış</th><th>Değişim</th></tr></thead>
  <tbody id="tablo"><tr><td colspan="4">Yükleniyor…</td></tr></tbody>
</table>
<p><small id="durum"></small></p>
<p><small>Veriler: <a href="https://gramhane.com" style="color:#f59e0b">Gramhane</a></small></p>

<script>
// Tarayıcı User-Agent'ı otomatik gönderir; CORS açık olduğu için doğrudan çağrılabilir.
const API = "https://api.gramhane.com/v1/prices.json";
const GOSTER = [
  ["Gram Altın", (v) => v.kurlar.ALTIN],
  ["Dolar", (v) => v.kurlar.USD],
  ["Euro", (v) => v.kurlar.EUR],
  ["22 Ayar Bilezik", (v) => v.ziynet_ve_diger["22 Ayar Bilezik"]],
  ["Çeyrek (Yeni)", (v) => v.ziynet_ve_diger["Çeyrek (Yeni)"]],
  ["Gümüş", (v) => v.kurlar.GUMUS],
];
const tl = (n) => n.toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

async function yenile() {
  const durum = document.getElementById("durum");
  try {
    const yanit = await fetch(API, { cache: "no-store" });
    if (!yanit.ok) throw new Error("HTTP " + yanit.status);
    const v = await yanit.json();

    document.getElementById("tablo").innerHTML = GOSTER.map(([ad, sec]) => {
      const f = sec(v);
      if (!f) return "";
      const sinif = f.yuzde > 0 ? "yukari" : f.yuzde < 0 ? "asagi" : "";
      return `<tr><td>${ad}</td><td>${tl(f.alis)}</td><td>${tl(f.satis)}</td><td class="${sinif}">%${tl(f.yuzde)}</td></tr>`;
    }).join("");
    durum.textContent = "Son güncelleme: " + v.meta.tarih;
  } catch (e) {
    durum.textContent = "Veri alınamadı: " + e.message;
  }
}

yenile();
setInterval(yenile, 60000); // dakikada bir yeterli
</script>
</body>
</html>
